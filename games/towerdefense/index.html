<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbital Defense – Martin Sucker</title>
<meta name="description" content="Orbital Defense: Sci-Fi Tower Defense im Browser – 20 Level, 7 Türme und 6 Gegnertypen.">
<meta name="author" content="Martin Sucker">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.martinsucker.de/games/towerdefense/">
<meta name="theme-color" content="#0a0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0c14'/%3E%3Ctext x='26' y='45' font-family='Courier New,monospace' font-size='40' font-weight='bold' text-anchor='middle' fill='%2300f0ff'%3EM%3C/text%3E%3Crect x='46' y='24' width='8' height='22' fill='%23ff2bd6'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
/* Apply stored theme early to avoid a flash */
try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}
</script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="mode home" href="https://www.martinsucker.de/" aria-label="Startseite" data-i18n-aria="backAria">← <span class="dom" data-i18n="home">Startseite</span></a>
    <span class="spacer"></span>
    <button class="mode" id="mode" type="button" data-i18n-aria="themeAria" aria-label="Design wechseln">☀ Lightmode</button>
    <button class="mode" id="lang" type="button" aria-label="Sprache wechseln / Switch language">English</button>
  </div>

  <header>
    <h1>Orbital Defense<span class="cursor" aria-hidden="true"></span></h1>
    <p class="role" data-i18n="subtitle">Sci-Fi Tower Defense im Browser</p>
  </header>

  <section class="game-card">
    <div class="game" id="game">
      <div class="hud" aria-live="polite">
        <span id="hLevel">Level 1/10</span>
        <span id="hWave">Welle 0/5</span>
        <span id="hCredits" class="c2">◆ 200</span>
        <span id="hLives">♥ 20</span>
      </div>

      <div class="stage" id="stage">
        <p class="rot" data-i18n="rotate">↻ Tipp: Gerät quer halten</p>
        <div class="board" id="board">
          <canvas id="cv" data-i18n-aria="boardAria" aria-label="Spielfeld"></canvas>
          <div class="toast" id="toast" aria-live="polite"></div>
          <div class="overlay" id="ov" role="dialog" aria-modal="false"></div>
        </div>
      </div>

      <div class="side">
        <div class="towers" id="towers" role="toolbar" data-i18n-aria="towersAria" aria-label="Türme"></div>
        <div class="info" id="info"></div>
        <div class="ctrl">
          <button class="mode primary" id="bWave" type="button">▶ Welle</button>
          <button class="mode" id="bPause" type="button">❚❚ Pause</button>
          <button class="mode" id="bSpeed" type="button">Tempo ×1</button>
          <button class="mode" id="bFs" type="button">⛶ Vollbild</button>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="helpTitle">Steuerung</h2>
    <div class="svc">
      <div><strong data-i18n="helpTouch">Touch &amp; Maus</strong><p data-i18n="helpTouchText"></p></div>
      <div><strong data-i18n="helpKeys">Tastatur</strong>
        <ul class="keys" id="keys"></ul>
      </div>
      <div><strong data-i18n="helpCodes">Cheatcodes</strong><p data-i18n="helpCodesText"></p></div>
    </div>
  </section>
</div>
<footer>
  <div>by Martin Sucker | <a href="https://github.com/DerSucker" target="_blank" rel="noopener">github.com/DerSucker</a></div>
</footer>
<script src="td-core.js"></script>
<script src="game.js"></script>
</body>
</html>
