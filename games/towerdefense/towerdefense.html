<style>
/* Orbital Defense – page frame in the style of www.martinsucker.de
   by Martin Sucker | github.com/DerSucker | www.martinsucker.de */
:root{
  --bg:#0a0c14; --card:#121626; --line:#262c47; --text:#d9deef; --muted:#8b93b3;
  --neon1:#00f0ff; --neon2:#ff2bd6; --glow:0 0 6px var(--neon1),0 0 18px rgba(0,240,255,.55);
  --glow2:0 0 6px var(--neon2),0 0 18px rgba(255,43,214,.5);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f3f4fa; --card:#ffffff; --line:#d5d9ec; --text:#1b2033; --muted:#555d7e;
  --neon1:#0077c8; --neon2:#c0109d; --glow:0 0 1px rgba(0,119,200,.6),0 0 10px rgba(0,119,200,.3);
  --glow2:0 0 1px rgba(192,16,157,.6),0 0 10px rgba(192,16,157,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Special Elite','American Typewriter','Courier New',Courier,monospace;line-height:1.65;min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
body.noscroll{overflow:hidden}
.wrap{width:100%;max-width:980px;margin:0 auto;padding:1.25rem 1.25rem 2rem;flex:1}
.top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.top .spacer{flex:1}
button.mode,a.mode{font:inherit;font-size:.9rem;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;cursor:pointer;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button.mode:hover,a.mode:hover{border-color:var(--neon1)}
button.mode:disabled{opacity:.45;cursor:default;border-color:var(--line)}
button.mode.primary{border-color:var(--neon1);color:var(--neon1)}
button.mode.primary:disabled{color:var(--text);border-color:var(--line)}
:focus-visible{outline:2px solid var(--neon1);outline-offset:3px}
header{padding:2.2rem 0 1.6rem}
h1{font-weight:400;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.1;margin:0 0 .75rem;color:var(--neon1);text-shadow:var(--glow)}
.role{font-size:1.15rem;color:var(--text);margin:0}
.cursor{display:inline-block;width:.55em;height:1.05em;background:var(--neon2);vertical-align:-.15em;margin-left:.2em;box-shadow:var(--glow2);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h2{font-weight:400;font-size:1.4rem;margin:0 0 .9rem;color:var(--neon2);text-shadow:var(--glow2)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.4rem;margin-bottom:1.1rem}
p{margin:0;max-width:62ch}
a{color:var(--neon1)}
footer{text-align:center;padding:1.2rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.svc{display:grid;gap:1rem}
.svc>div{border-left:2px solid var(--neon1);padding-left:.9rem}
.svc strong{font-weight:400;color:var(--neon1)}
.svc p{font-size:.92rem;color:var(--muted)}
ul.keys{list-style:none;margin:.3rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.5rem}
ul.keys li{border:1px solid var(--line);border-radius:8px;padding:.25rem .65rem;font-size:.85rem;color:var(--muted)}
ul.keys kbd{font:inherit;color:var(--neon1)}

/* ---------- game window ---------- */
.game-card{padding:.9rem}
.game{display:flex;flex-direction:column;gap:.6rem;color:var(--text)}
.hud{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;color:var(--neon1);text-shadow:var(--glow);font-size:1rem;padding:0 .2rem}
.hud .c2{color:var(--neon2);text-shadow:var(--glow2)}
.hud .warn{color:#ff4d6d;text-shadow:0 0 8px rgba(255,77,109,.7)}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.board{position:relative;width:100%;max-width:max(320px,calc((100svh - 300px) * 1.6));margin:0 auto;aspect-ratio:16/10;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.toast{position:absolute;left:50%;top:.6rem;transform:translateX(-50%);padding:.25rem .8rem;border-radius:999px;background:var(--card);border:1px solid var(--neon2);color:var(--neon2);font-size:.85rem;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);text-align:center;overflow:auto}
.overlay[hidden]{display:none}
.ovbox{max-width:34rem;display:flex;flex-direction:column;align-items:center;gap:.7rem;margin:auto}
.ovbox h2{margin:0;font-size:clamp(1.2rem,4vw,1.8rem)}
.ovbox p{color:var(--muted);font-size:.95rem;margin:0}
.ovbox .btns{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
.code{display:inline-block;font-size:clamp(1.3rem,5vw,2rem);letter-spacing:.18em;color:var(--neon1);text-shadow:var(--glow);border:1px dashed var(--neon1);border-radius:10px;padding:.2rem .9rem;user-select:all;-webkit-user-select:all}
.codeform{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;align-items:center}
.codeform input{font:inherit;font-size:16px;width:11rem;max-width:100%;padding:.45rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);text-transform:uppercase;letter-spacing:.1em}
.codeform input:focus{outline:none;border-color:var(--neon1)}
.err{color:#ff4d6d!important;min-height:1.2em}

.side{display:flex;flex-direction:column;gap:.6rem}
.towers{display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem}
.towers.n7{grid-template-columns:repeat(7,1fr)}
.tbtn{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.35rem .2rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.1rem;line-height:1.2;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative}
.tbtn:hover{border-color:var(--tc)}
.tbtn .ic{width:26px;height:26px;display:block}
.tbtn .nm{font-size:.82rem}
.tbtn .ct{font-size:.78rem;color:var(--neon2)}
.tbtn .k{position:absolute;top:.15rem;left:.4rem;font-size:.7rem;color:var(--muted)}
.tbtn.on{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc),0 0 12px color-mix(in srgb,var(--tc) 55%,transparent)}
.tbtn.poor{opacity:.45}
.info{min-height:2.6rem;font-size:.88rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;padding:.1rem .2rem}
.info b{font-weight:400;color:var(--text)}
.info .acts{display:flex;gap:.5rem;flex-wrap:wrap}
.info .mode{padding:.3rem .8rem;font-size:.85rem}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem}
.ctrl .mode{padding:.5rem .3rem;white-space:nowrap}
@media (hover:none){.tbtn .k{display:none}}
@media (max-width:420px){.top .dom{display:none}}
@media (max-width:560px){
  .wrap{padding:1rem .75rem 1.5rem}
  .top{gap:.4rem}
  .top .mode{font-size:.8rem;padding:.4rem .75rem}
  .game-card{padding:.55rem;border-radius:12px}
  .hud{font-size:.88rem}
  .tbtn .nm{font-size:.72rem}
  .tbtn .ct{font-size:.7rem}
  .tbtn .ic{width:22px;height:22px}
  .towers.n7{grid-template-columns:repeat(4,1fr)}
  .ctrl .mode{font-size:.78rem}
  section{padding:1.1rem}
}

/* ---------- fullscreen (native + iOS fallback) ---------- */
.game.is-fs{position:fixed;inset:0;z-index:200;background:var(--bg);margin:0;width:100%;height:100%;
  padding:max(.5rem,env(safe-area-inset-top)) max(.5rem,env(safe-area-inset-right)) max(.5rem,env(safe-area-inset-bottom)) max(.5rem,env(safe-area-inset-left))}
.game.is-fs .stage{flex:1}
.game.is-fs .board{aspect-ratio:auto;max-width:none}
@media (orientation:landscape) and (max-height:620px){
  .game.is-fs{display:grid;grid-template-columns:minmax(0,1fr) 210px;grid-template-rows:auto minmax(0,1fr);gap:.4rem .6rem}
  .game.is-fs .hud{grid-column:1;grid-row:1;font-size:.85rem}
  .game.is-fs .stage{grid-column:1;grid-row:2}
  .game.is-fs .side{grid-column:2;grid-row:1/3;min-height:0;gap:.4rem}
  .game.is-fs .towers{grid-template-columns:1fr;gap:.3rem}
  .game.is-fs .tbtn{flex-direction:row;justify-content:flex-start;gap:.45rem;padding:.15rem .5rem;min-height:34px}
  .game.is-fs .tbtn .ic{width:22px;height:22px}
  .game.is-fs .tbtn .nm{font-size:.8rem}
  .game.is-fs .tbtn .ct{margin-left:auto;font-size:.75rem}
  .game.is-fs .tbtn .k{display:none}
  .game.is-fs .towers.n7{grid-template-columns:repeat(2,minmax(0,1fr))}
  .game.is-fs .towers.n7 .tbtn{gap:.3rem;padding:.1rem .4rem;min-height:32px;min-width:0}
  .game.is-fs .towers.n7 .nm{display:none}
  .game.is-fs .towers.n7 .ct{font-size:.72rem;white-space:nowrap}
  .game.is-fs .towers.n7 .ic{width:20px;height:20px}
  .game.is-fs .info{flex:1;min-height:0;overflow-y:auto;font-size:.72rem;line-height:1.4;align-content:flex-start}
  .game.is-fs .info .mode{font-size:.72rem;padding:.25rem .6rem}
  .game.is-fs .ctrl{grid-template-columns:1fr 1fr;gap:.3rem}
  .game.is-fs .ctrl .mode{font-size:.75rem;padding:.4rem .2rem}
}
.rot{display:none;position:absolute;bottom:.4rem;left:0;right:0;text-align:center;color:var(--muted);font-size:.8rem;margin:0 auto;pointer-events:none}
@media (orientation:portrait){.game.is-fs .rot{display:block}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
<script>
/* Apply stored theme early to avoid a flash */
try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}
</script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="mode home" href="https://www.martinsucker.de/" aria-label="Startseite" data-i18n-aria="backAria">← <span class="dom" data-i18n="home">Startseite</span></a>

    <button class="mode" id="mode" type="button" data-i18n-aria="themeAria" aria-label="Design wechseln">☀ Lightmode</button>

  </div>

  <header>
    <h1>Orbital Defense<span class="cursor" aria-hidden="true"></span></h1>

  <section class="game-card">

      </div>

      <div class="side">
        <div class="towers" id="towers" role="toolbar" data-i18n-aria="towersAria" aria-label="Türme"></div>
        <div class="info" id="info"></div>
        <div class="ctrl">
          <button class="mode primary" id="bWave" type="button">▶ Welle</button>
          <button class="mode" id="bPause" type="button">❚❚ Pause</button>
          <button class="mode" id="bSpeed" type="button">Tempo ×1</button>
          <button class="mode" id="bFs" type="button">⛶ Vollbild</button>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="helpTitle">Steuerung</h2>

        <ul class="keys" id="keys"></ul>
      </div>
      <div><strong data-i18n="helpCodes">Cheatcodes</strong><p data-i18n="helpCodesText"></p></div>
    </div>
  </section>
</div>
<footer>
  <div>by Martin Sucker | <a href="https://github.com/DerSucker" target="_blank" rel="noopener">github.com/DerSucker</a></div>
</footer>
<script>

(function (root) {
  'use strict';

  var COLS = 16, ROWS = 10;
  var UNLOCK_LI = 10; // level index from which new towers and enemies appear (level 11)

  /* Towers: 3 stages each (base + 2 upgrades). u = upgrade cost to reach this stage.
     r = range (tiles), d = damage (per hit, or per second for beams), f = shots per second,
     s = splash radius, sl = slow factor, c = chain targets, p = ignores armor,
     beam = continuous beam ramping up to x3, push = knockback tiles, stun = seconds */
  var TOWERS = [
    { id: 'laser',  key: '1', cost: 50,  lv: [
      { r: 2.5, d: 8,  f: 4 },
      { r: 2.8, d: 14, f: 4.5, u: 60 },
      { r: 3.1, d: 24, f: 5,   u: 110 } ] },
    { id: 'plasma', key: '2', cost: 90,  lv: [
      { r: 2.6, d: 22, f: 0.9, s: 0.9 },
      { r: 2.9, d: 38, f: 1,   s: 1,    u: 90 },
      { r: 3.2, d: 62, f: 1.1, s: 1.15, u: 160 } ] },
    { id: 'cryo',   key: '3', cost: 70,  lv: [
      { r: 2,   d: 3,  f: 1, sl: 0.35 },
      { r: 2.3, d: 6,  f: 1, sl: 0.45, u: 70 },

    { id: 'rail',   key: '4', cost: 130, lv: [

      { r: 5.5, d: 230, f: 0.55, p: 1, u: 200 } ] },
    { id: 'tesla',  key: '5', cost: 110, lv: [
      { r: 2.4, d: 14, f: 1.2, c: 3 },
      { r: 2.6, d: 22, f: 1.4, c: 4, u: 100 },
      { r: 2.9, d: 34, f: 1.6, c: 6, u: 170 } ] },
    { id: 'prism',  key: '6', cost: 150, unlock: UNLOCK_LI, lv: [
      { r: 3,   d: 30, beam: 1 },
      { r: 3.3, d: 55, beam: 1, u: 140 },
      { r: 3.6, d: 95, beam: 1, u: 230 } ] },
    { id: 'grav',   key: '7', cost: 120, unlock: UNLOCK_LI, lv: [
      { r: 2,   d: 5,  f: 0.4,  push: 0.8, stun: 0.4 },
      { r: 2.3, d: 10, f: 0.45, push: 1.1, stun: 0.6, u: 110 },
      { r: 2.6, d: 18, f: 0.5,  push: 1.5, stun: 0.8, u: 180 } ] }
  ];

  /* Enemies: hp, sp = tiles/s, rw = credits, armor = flat damage reduction, dmg = core damage */
  var ENEMIES = {
    drone:    { hp: 28,  sp: 2.1,  rw: 5,  armor: 0, dmg: 1, size: 0.26, gap: 0.45 },
    cyborg:   { hp: 75,  sp: 1.25, rw: 9,  armor: 1, dmg: 1, size: 0.32, gap: 0.75 },
    walker:   { hp: 240, sp: 0.72, rw: 22, armor: 4, dmg: 2, size: 0.4,  gap: 1.4 },
    shield:   { hp: 110, sp: 1.0,  rw: 14, armor: 0, dmg: 1, size: 0.32, gap: 0.9, shield: 90 },
    splitter: { hp: 150, sp: 0.9,  rw: 12, armor: 2, dmg: 2, size: 0.36, gap: 1.1, split: 3 },
    phaser:   { hp: 85,  sp: 1.35, rw: 12, armor: 1, dmg: 1, size: 0.3,  gap: 0.7, blink: 1.6 }
  };

  /* Levels: waypoints are grid cells; -1 / COLS / ROWS = off-grid entry or exit */
  var LEVELS = [
    { code: null,         hp: 1.15, credits: 200, waves: 5,  paths: [[[-1,2],[5,2],[5,7],[11,7],[11,3],[16,3]]] },
    { code: 'ASTEROID',   hp: 1.15, credits: 230, waves: 5,  paths: [[[-1,7],[3,7],[3,2],[8,2],[8,8],[13,8],[13,4],[16,4]]] },
    { code: 'MARS',       hp: 1.00, credits: 260, waves: 6,  paths: [[[4,-1],[4,4],[10,4],[10,1],[14,1],[14,8],[2,8],[2,10]]] },
    { code: 'JUPITER',    hp: 1.10, credits: 290, waves: 6,  paths: [[[-1,1],[13,1],[13,4],[2,4],[2,7],[13,7],[13,10]]] },
    { code: 'SATURN',     hp: 1.35, credits: 320, waves: 7,  paths: [[[-1,8],[12,8],[12,2],[4,2],[4,5],[9,5],[9,-1]]] },
    { code: 'NEBULA',     hp: 0.75, credits: 360, waves: 7,  paths: [[[-1,2],[7,2],[7,5],[16,5]], [[-1,8],[7,8],[7,5],[16,5]]] },
    { code: 'COMET',      hp: 1.15, credits: 400, waves: 8,  paths: [[[8,-1],[8,2],[2,2],[2,7],[6,7],[6,4],[11,4],[11,8],[14,8],[14,-1]]] },
    { code: 'PULSAR',     hp: 0.85, credits: 440, waves: 8,  paths: [[[-1,1],[4,1],[4,5],[10,5],[10,9],[16,9]], [[16,1],[12,1],[12,5],[10,5],[10,9],[16,9]]] },
    { code: 'WARP',       hp: 1.05, credits: 480, waves: 9,  paths: [[[-1,0],[14,0],[14,3],[1,3],[1,6],[14,6],[14,9],[-1,9]]] },
    { code: 'BLACKHOLE',  hp: 0.65, credits: 540, waves: 10, paths: [[[7,-1],[7,2],[2,2],[2,5],[13,5],[13,8],[16,8]], [[-1,8],[4,8],[4,5],[13,5],[13,8],[16,8]]] },

    { code: 'OORT',       hp: 0.37, credits: 640, waves: 8,  paths: [[[-1,1],[5,1],[5,4],[16,4]], [[-1,8],[9,8],[9,4],[16,4]]] },
    { code: 'PROXIMA',    hp: 0.96, credits: 680, waves: 9,  paths: [[[-1,0],[15,0],[15,9],[1,9],[1,2],[13,2],[13,7],[3,7],[3,4],[10,4]]] },
    { code: 'BINARY',     hp: 0.23, credits: 720, waves: 9,  paths: [[[-1,1],[6,1],[6,3],[2,3],[2,6],[7,6],[7,5]], [[16,8],[12,8],[12,1],[9,1],[9,5],[7,5]]] },
    { code: 'SUPERNOVA',  hp: 0.47, credits: 760, waves: 10, paths: [[[3,-1],[3,3],[1,3],[1,8],[8,8],[8,2],[12,2],[12,7],[16,7]]] },
    { code: 'DARKMATTER', hp: 0.46, credits: 800, waves: 10, paths: [[[-1,0],[10,0],[10,4],[16,4]], [[-1,9],[4,9],[4,6],[10,6],[10,4],[16,4]]] },
    { code: 'QUASAR',     hp: 0.43, credits: 840, waves: 11, paths: [[[1,-1],[1,8],[4,8],[4,1],[7,1],[7,8],[10,8],[10,1],[13,1],[13,8],[16,8]]] },

    if (ui.kb.on && !ui.ov) {
      ctx.strokeStyle = COL.neon2; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
      ctx.strokeRect(ui.kb.c * T + 2, ui.kb.r * T + 2, T - 4, T - 4); ctx.setLineDash([]);
    }

    // enemies
    S.enemies.forEach(function (e) { drawEnemy(ctx, e, time); });

    // projectiles
    S.shots.forEach(function (sh) {
      ctx.save(); ctx.fillStyle = TCOL[sh.tw]; ctx.shadowColor = TCOL[sh.tw]; ctx.shadowBlur = COL.light ? 0 : 12;
      ctx.beginPath(); ctx.arc(sh.x * T, sh.y * T, 5, 0, 7); ctx.fill(); ctx.restore();
    });

    // effects
    S.fx.forEach(function (f) {
      var col = f.tw != null ? TCOL[f.tw] : ECOL[f.type], k = f.max ? f.t / f.max : 1;
      ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = COL.light ? 0 : 10;
      if (f.k === 'beam') {
        ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(f.x1 * T, f.y1 * T); ctx.lineTo(f.x2 * T, f.y2 * T); ctx.stroke();
      } else if (f.k === 'rail') {
        ctx.globalAlpha = k; ctx.lineWidth = 1 + 4 * k; ctx.beginPath(); ctx.moveTo(f.x1 * T, f.y1 * T); ctx.lineTo(f.x2 * T, f.y2 * T); ctx.stroke();
      } else if (f.k === 'ring') {
        ctx.globalAlpha = k * 0.8; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x * T, f.y * T, f.r * T * (1 - k * 0.7), 0, 7); ctx.stroke();
      } else if (f.k === 'boom') {
        ctx.globalAlpha = k * 0.5; ctx.beginPath(); ctx.arc(f.x * T, f.y * T, f.r * T * (1.1 - k * 0.6), 0, 7); ctx.fill();
      } else if (f.k === 'chain') {
        ctx.lineWidth = 2; ctx.beginPath();
        for (var i = 0; i < f.pts.length - 1; i++) {
          var a = f.pts[i], b = f.pts[i + 1];
          ctx.moveTo(a.x * T, a.y * T);
          for (var j = 1; j < 4; j++) {
            var m = j / 4; ctx.lineTo((a.x + (b.x - a.x) * m) * T + (Math.random() - 0.5) * 10, (a.y + (b.y - a.y) * m) * T + (Math.random() - 0.5) * 10);
          }
          ctx.lineTo(b.x * T, b.y * T);
        }
        ctx.stroke();
      } else if (f.k === 'grav') {
        ctx.globalAlpha = k * 0.8; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.arc(f.x * T, f.y * T, f.r * T * k, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      } else if (f.k === 'blink') {
        ctx.globalAlpha = k * 0.7; ctx.lineWidth = 2; ctx.setLineDash([2, 5]);
        ctx.beginPath(); ctx.moveTo(f.x1 * T, f.y1 * T); ctx.lineTo(f.x2 * T, f.y2 * T); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(f.x1 * T, f.y1 * T, 10 * (1.5 - k), 0, 7); ctx.stroke();
      } else if (f.k === 'pop') {
        ctx.globalAlpha = k; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x * T, f.y * T, f.r * T * (2 - k), 0, 7); ctx.stroke();
        for (var q = 0; q < 6; q++) {
          var aa = q * 1.047 + f.x, d = f.r * T * (2.4 - 1.6 * k);
          ctx.fillRect(f.x * T + Math.cos(aa) * d - 1.5, f.y * T + Math.sin(aa) * d - 1.5, 3, 3);
        }
      }
      ctx.restore();
    });

    // floating credit texts
    ctx.font = '13px "Special Elite","Courier New",monospace'; ctx.textAlign = 'center';
    ui.floats.forEach(function (fl) { ctx.globalAlpha = Math.max(0, fl.t); ctx.fillStyle = COL.neon2; ctx.fillText(fl.s, fl.x * T, fl.y * T - (1 - fl.t) * 18); });
    ctx.globalAlpha = 1;
  }

  /* ---------- HUD & panels ---------- */
  function updateHud() {
    var key = S ? [lang, S.li, S.wave, S.credits, S.lives, S.active, S.status, ui.ov, ui.speed].join('|') : lang + '|none';
    if (key === ui.hudKey) return;
    ui.hudKey = key;
    if (!S) return;
    $('hLevel').textContent = t('hudLevel', { n: S.li + 1, m: C.LEVELS.length });
    $('hWave').textContent = t('hudWave', { n: S.wave, m: S.waves });
    $('hCredits').textContent = '◆ ' + S.credits;
    var hl = $('hLives'); hl.textContent = '♥ ' + S.lives; hl.classList.toggle('warn', S.lives <= 5);
    bWave.textContent = S.active ? t('waveRun') : t('waveBtn', { n: Math.min(S.wave + 1, S.waves) });
    bWave.disabled = !!(S.active || ui.ov || S.status !== 'build' || S.wave >= S.waves);
    bPause.disabled = !!(ui.ov && ui.ov !== 'pause');
    bSpeed.textContent = t('speed', { n: ui.speed });
    if (ui.towerLi !== S.li) buildTowerButtons();
    Array.prototype.forEach.call(towersEl.children, function (b) {
      var i = +b.getAttribute('data-i');
      b.classList.toggle('poor', S.credits < C.TOWERS[i].cost);
      b.classList.toggle('on', !!(ui.sel && ui.sel.mode === 'build' && ui.sel.type === i));
      b.setAttribute('aria-pressed', ui.sel && ui.sel.mode === 'build' && ui.sel.type === i ? 'true' : 'false');
    });
    updateInfo();
  }
  function statsText(type, lv) {
    var st = C.TOWERS[type].lv[lv], id = C.TOWERS[type].id;
    if (st.beam) return t('stBeam', { d: num(st.d, 0), r: num(st.r) }) + ' · ' + t('xRamp');
    var s = t('st', { d: num(st.d, 0), r: num(st.r), f: num(st.f, 2) });
    if (st.push) s += ' · ' + t('xPush', { p: num(st.push), t: num(st.stun) });
    if (st.s) s += ' · ' + t('xSplash', { s: num(st.s) });
    if (st.sl) s += ' · ' + t('xSlow', { p: Math.round(st.sl * 100) });
    if (st.c) s += ' · ' + t('xChain', { c: st.c });
    if (id === 'rail') s += ' · ' + t('xPierce');
    return s;
  }
  function updateInfo() {
    var sel = ui.sel, key;
    if (!S || !sel) key = 'idle';
    else if (sel.mode === 'build') key = 'b' + sel.type;
    else key = 't' + sel.tower.id + '.' + sel.tower.lv + '.' + (S.credits >= (C.upgradeCost(sel.tower) || 1e9));
    key += lang;
    if (key === ui.infoKey) return;
    ui.infoKey = key;
    infoEl.textContent = '';
    if (!S || !sel) { infoEl.appendChild(document.createTextNode(t('hintIdle'))); return; }
    var id;
    if (sel.mode === 'build') {
      id = C.TOWERS[sel.type].id;
      addB(t('tn_' + id) + ' · ' + C.TOWERS[sel.type].cost + ' ◆');
      addS(t('td_' + id) + ' ' + statsText(sel.type, 0) + '. ' + t('hintBuild'));
      return;
    }
    var tw = sel.tower; id = C.TOWERS[tw.type].id;
    addB(t('tn_' + id) + ' · ' + t('lvl', { n: tw.lv + 1 }));
    addS(statsText(tw.type, tw.lv));
    var acts = document.createElement('span'); acts.className = 'acts';
    var cost = C.upgradeCost(tw), up = document.createElement('button');
    up.className = 'mode primary'; up.type = 'button';
    up.textContent = cost ? t('up', { c: cost }) : t('max');
    up.disabled = !cost || S.credits < cost;
    up.addEventListener('click', doUpgrade);
    var sl = document.createElement('button'); sl.className = 'mode'; sl.type = 'button';
    sl.textContent = t('sell', { v: C.sellValue(tw) });
    sl.addEventListener('click', doSell);
    acts.appendChild(up); acts.appendChild(sl); infoEl.appendChild(acts);
    function addB(s) { var b = document.createElement('b'); b.textContent = s; infoEl.appendChild(b); }
    function addS(s) { var sp = document.createElement('span'); sp.textContent = s; infoEl.appendChild(sp); }
  }
  function refresh() { ui.hudKey = ''; ui.infoKey = ''; updateHud(); updateInfo(); }

  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------- tower buttons ---------- */
  function buildTowerButtons() {
    towersEl.textContent = '';
    var li = S ? S.li : 0, n = 0;
    C.TOWERS.forEach(function (tw, i) {
      if (!C.towerUnlocked(i, li)) return;
      n++;
      var b = document.createElement('button');
      b.setAttribute('data-i', i);
      b.type = 'button'; b.className = 'tbtn'; b.style.setProperty('--tc', TCOL[i]);
      var ic = document.createElement('canvas'); ic.className = 'ic'; ic.width = 52; ic.height = 52;
      var g = ic.getContext('2d'); g.scale(52 / 48, 52 / 48); drawTower(g, i, 24, 24, null, -Math.PI / 2, 0.6, 48);
      var k = document.createElement('span'); k.className = 'k'; k.textContent = tw.key;
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = t('tn_' + tw.id);
      var ct = document.createElement('span'); ct.className = 'ct'; ct.textContent = tw.cost + ' ◆';
      b.appendChild(k); b.appendChild(ic); b.appendChild(nm); b.appendChild(ct);
      b.title = t('td_' + tw.id);
      b.addEventListener('click', function () { pickTower(i); });
      towersEl.appendChild(b);
    });
    towersEl.classList.toggle('n7', n > 5);
    ui.towerLi = li;
  }

  /* ---------- actions ---------- */
  function pickTower(i) {
    if (!S || ui.ov || !C.TOWERS[i]) return;
    if (!C.towerUnlocked(i, S.li)) { toast(t('errLocked')); return; }
    ui.sel = (ui.sel && ui.sel.mode === 'build' && ui.sel.type === i) ? null : { mode: 'build', type: i };
    refresh();
  }
  function tapCell(c, r) {
    if (!S || ui.ov || c < 0 || r < 0 || c >= C.COLS || r >= C.ROWS) return;
    var tw = C.towerAt(S, c, r);
    if (tw) { ui.sel = { mode: 'tower', tower: tw }; refresh(); return; }
    if (ui.sel && ui.sel.mode === 'build') {
      var res = C.build(S, ui.sel.type, c, r);
      if (!res.ok) toast(t(res.err === 'money' ? 'errMoney' : 'errBlocked'));
      else if (S.credits < C.TOWERS[ui.sel.type].cost) ui.sel = null;
    } else ui.sel = null;
    refresh();
  }
  function doUpgrade() {
    if (!S || !ui.sel || ui.sel.mode !== 'tower' || ui.ov) return;
    var res = C.upgrade(S, ui.sel.tower);
    if (!res.ok) toast(t(res.err === 'money' ? 'errMoney' : 'errMax'));
    refresh();
  }
  function doSell() {
    if (!S || !ui.sel || ui.sel.mode !== 'tower' || ui.ov) return;
    var tw = ui.sel.tower, v = C.sell(S, tw);
    ui.floats.push({ s: '+' + v, x: tw.x, y: tw.y, t: 1 });
    ui.sel = null; refresh();
  }
  function startWave() { if (S && !ui.ov && C.startWave(S)) refresh(); }
  function togglePause() {
    if (ui.ov === 'pause') hideOv();
    else if (!ui.ov && S) showOv('pause');
  }
  function cycleSpeed() { ui.speed = ui.speed >= 3 ? 1 : ui.speed + 1; refresh(); }

  /* ---------- overlays ---------- */
  function startLevel(li) {
    S = C.createLevel(li);
    ui.sel = null; ui.floats = []; bgDirty = true;
    showOv('intro');
  }
  function showOv(kind) { ui.ov = kind; renderOv(); refresh(); }
  function hideOv() { ui.ov = null; ov.hidden = true; ov.textContent = ''; refresh(); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function btn(act, label, primary) { return '<button type="button" class="mode' + (primary ? ' primary' : '') + '" data-act="' + act + '">' + esc(label) + '</button>'; }
  function renderOv() {
    if (!ui.ov) { ov.hidden = true; return; }
    var h = '', lvl = S ? C.LEVELS[S.li] : null, name = S ? I18N[lang].names[S.li] : '';
    var codeBlock = (S && lvl.code) ? '<p>' + esc(t('codeInfo')) + '</p><span class="code">' + esc(lvl.code) + '</span><p>' + esc(t('codeHint')) + '</p>' : '';
    if (ui.ov === 'menu') {
      var pre = ov.querySelector('#codeIn'), val = pre ? pre.value : '';
      h = '<h2>Orbital Defense</h2><p>' + esc(t('menuText')) + '</p><div class="btns">' + btn('new', t('newGame'), true) + '</div>' +
        '<form class="codeform" id="codeForm" autocomplete="off"><input id="codeIn" maxlength="16" autocapitalize="characters" spellcheck="false" placeholder="' + esc(t('codePh')) + '" aria-label="' + esc(t('codeAria')) + '" value="' + esc(val) + '">' +
        '<button type="submit" class="mode">' + esc(t('loadCode')) + '</button></form><p class="err" id="codeErr"></p>';
    } else if (ui.ov === 'intro') {
      h = '<h2>' + esc(t('introTitle', { n: S.li + 1, name: name })) + '</h2><p>' + esc(t('introInfo', { w: S.waves, c: S.credits })) + '</p>' +
        (S.li === 0 ? '<p>' + esc(t('tip1')) + '</p><p>' + esc(t('enemies')) + '</p>' : codeBlock) +
        (S.li === C.UNLOCK_LI ? '<h2>' + esc(t('newTitle')) + '</h2><p>' + esc(t('newEnemies')) + '</p><p>' + esc(t('newTowers')) + '</p>' : '') +
        '<div class="btns">' + btn('start', t('startLevel'), true) + btn('menu', t('menu')) + '</div>';
    } else if (ui.ov === 'won') {
      h = '<h2>' + esc(t('wonTitle')) + '</h2><p>' + esc(t('wonText', { l: S.lives, m: S.maxLives, c: S.credits })) + '</p><div class="btns">' + btn('next', t('next'), true) + btn('menu', t('menu')) + '</div>';
    } else if (ui.ov === 'victory') {
      h = '<h2>' + esc(t('vicTitle')) + '</h2><p>' + esc(t('vicText')) + '</p><div class="btns">' + btn('menu', t('menu'), true) + '</div>';
    } else if (ui.ov === 'lost') {
      h = '<h2>' + esc(t('lostTitle')) + '</h2><p>' + esc(t('lostText', { n: S.li + 1 })) + '</p><div class="btns">' + btn('retry', t('retry'), true) + btn('menu', t('menu')) + '</div>';
    } else if (ui.ov === 'pause') {
      h = '<h2>' + esc(t('pauseTitle')) + '</h2><p>' + esc(t('introTitle', { n: S.li + 1, name: name })) + '</p>' + codeBlock +
        '<div class="btns">' + btn('resume', t('resume'), true) + btn('retry', t('retry')) + btn('menu', t('menu')) + '</div>';
    }
    ov.innerHTML = '<div class="ovbox">' + h + '</div>';
    ov.hidden = false;
    var p = ov.querySelector('.primary');
    if (p && !('ontouchstart' in window)) p.focus({ preventScroll: true });
  }
  ov.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'new') startLevel(0);
    else if (a === 'start' || a === 'resume') hideOv();
    else if (a === 'next') startLevel(Math.min(S.li + 1, C.LEVELS.length - 1));
    else if (a === 'retry') startLevel(S.li);
    else if (a === 'menu') goMenu();
  });
  ov.addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('codeIn'), li = C.levelByCode(inp.value);
    if (li < 0) { $('codeErr').textContent = t('codeBad'); inp.select(); return; }
    startLevel(li);
  });
  function goMenu() { S = C.createLevel(0); ui.sel = null; bgDirty = true; showOv('menu'); }

  /* ---------- input: pointer ---------- */
  function cellOf(ev) {
    var r = cv.getBoundingClientRect();
    return { c: Math.floor((ev.clientX - r.left) / r.width * C.COLS), r: Math.floor((ev.clientY - r.top) / r.height * C.ROWS) };
  }
  cv.addEventListener('pointerdown', function (ev) {
    if (ev.button > 0) return;
    ev.preventDefault();
    ui.kb.on = false;
    var c = cellOf(ev); ui.hover = ev.pointerType === 'mouse' ? c : null;
    tapCell(c.c, c.r);
  });
  cv.addEventListener('pointermove', function (ev) { if (ev.pointerType === 'mouse') { ui.hover = cellOf(ev); ui.kb.on = false; } });
  cv.addEventListener('pointerleave', function () { ui.hover = null; });
  cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); ui.sel = null; refresh(); });
  cv.tabIndex = 0;

  /* ---------- input: keyboard ---------- */
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var k = ev.key, tag = ev.target && ev.target.tagName;
    if (tag === 'INPUT') return;
    if (k === 'f' || k === 'F') { ev.preventDefault(); toggleFs(); return; }
    if (ui.ov) {
      if (ui.ov === 'pause' && (k === 'p' || k === 'P' || k === 'Escape')) { ev.preventDefault(); hideOv(); return; }
      if ((k === 'Enter' || k === ' ') && tag !== 'BUTTON') { var p = ov.querySelector('.primary'); if (p) { ev.preventDefault(); p.click(); } }
      return;
    }
    if (!S) return;
    var mv = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0] }[k];
    if (mv) {
      ev.preventDefault();
      if (ui.kb.on) { ui.kb.c = Math.max(0, Math.min(C.COLS - 1, ui.kb.c + mv[0])); ui.kb.r = Math.max(0, Math.min(C.ROWS - 1, ui.kb.r + mv[1])); }
      ui.kb.on = true; return;
    }
    if (k >= '1' && k <= '7') { pickTower(+k - 1); if (!ui.hover) ui.kb.on = true; return; }
    if (k === 'Enter' || k === 'e' || k === 'E') { if (tag === 'BUTTON') return; ev.preventDefault(); ui.kb.on = true; tapCell(ui.kb.c, ui.kb.r); return; }
    if (k === 'u' || k === 'U') { doUpgrade(); return; }
    if (k === 'x' || k === 'X' || k === 'Delete' || k === 'Backspace') { ev.preventDefault(); doSell(); return; }
    if (k === ' ' || k === 'n' || k === 'N') { if (tag === 'BUTTON' && k === ' ') return; ev.preventDefault(); startWave(); return; }
    if (k === 'p' || k === 'P') { togglePause(); return; }
    if (k === 'Escape') { if (ui.sel) { ui.sel = null; refresh(); } else togglePause(); return; }
    if (k === 'g' || k === 'G' || k === '+') { cycleSpeed(); return; }
  });

  /* ---------- buttons ---------- */
  game.addEventListener('pointerup', function (e) {
    var b = e.target.closest('button'); if (b && e.pointerType !== 'keyboard') setTimeout(function () { b.blur(); }, 0);
  });
  bWave.addEventListener('click', startWave);
  bPause.addEventListener('click', togglePause);
  bSpeed.addEventListener('click', cycleSpeed);
  bFs.addEventListener('click', toggleFs);
  document.addEventListener('visibilitychange', function () { if (document.hidden && S && !ui.ov) showOv('pause'); });

  /* ---------- theme & language ---------- */
  function themeText() { modeBtn.textContent = root.getAttribute('data-theme') === 'light' ? t('dark') : t('light'); }
  modeBtn.addEventListener('click', function () {
    var light = root.getAttribute('data-theme') !== 'light';
    root.setAttribute('data-theme', light ? 'light' : 'dark');
    LS.set('theme', light ? 'light' : 'dark');
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', light ? '#f3f4fa' : '#0a0c14');
    themeText(); readColors(); buildTowerButtons(); bgDirty = true; refresh();
  });
  function applyLang() {
    root.lang = lang; document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    langBtn.textContent = lang === 'en' ? 'Deutsch' : 'English';
    themeText();
    bPause.textContent = t('pause'); bFs.textContent = isFs() ? t('fsExit') : t('fs');
    var keys = [['1–7', 'kTower'], ['← ↑ ↓ → / WASD', 'kMove'], ['Enter', 'kPlace'], ['U', 'kUpgrade'], ['X', 'kSell'], [t('kSpaceKey'), 'kWave'], ['P', 'kPause'], ['G', 'kSpeed'], ['F', 'kFs'], ['Esc', 'kEsc']];
    var ul = $('keys'); ul.textContent = '';
    keys.forEach(function (kv) {
      var li = document.createElement('li'), kb = document.createElement('kbd'); kb.textContent = kv[0];
      li.appendChild(kb); li.appendChild(document.createTextNode(' ' + t(kv[1]))); ul.appendChild(li);
    });
    buildTowerButtons();
    if (ui.ov) renderOv();
    refresh();
  }
  langBtn.addEventListener('click', function () { lang = lang === 'en' ? 'de' : 'en'; LS.set('lang', lang); applyLang(); });

  /* ---------- loop ---------- */
  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    ui.time += dt;
    if (S && !ui.ov) {
      var total = dt * ui.speed;
      while (total > 1e-6) { var h = Math.min(total, 1 / 60); C.step(S, h); total -= h; }
      while (S.events.length) handle(S.events.shift());
    }
    for (var i = ui.floats.length - 1; i >= 0; i--) { ui.floats[i].t -= dt * 1.2; if (ui.floats[i].t <= 0) ui.floats.splice(i, 1); }
    if (ui.sel && ui.sel.mode === 'tower' && S && S.towers.indexOf(ui.sel.tower) < 0) ui.sel = null;
    updateHud();
    draw();
    requestAnimationFrame(loop);
  }
  function handle(ev) {
    if (ev.k === 'kill') ui.floats.push({ s: '+' + ev.rw, x: ev.x, y: ev.y, t: 1 });
    else if (ev.k === 'wave' && S.status === 'build') toast(t('waveDone', { n: ev.n, b: ev.bonus }));
    else if (ev.k === 'leak') toast(t('leak'));
    else if (ev.k === 'won') { ui.sel = null; showOv(S.li >= C.LEVELS.length - 1 ? 'victory' : 'won'); }
    else if (ev.k === 'lost') { ui.sel = null; showOv('lost'); }
  }

  /* ---------- init ---------- */
  readColors();
  resize();
  applyLang();
  var q = (location.search.match(/[?&]code=([^&]+)/) || [])[1], qli = q ? C.levelByCode(decodeURIComponent(q)) : -1;
  if (qli > 0) startLevel(qli); else goMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
