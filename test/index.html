<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DerSucker - Digitale Visitenkarte</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="avatar"></div>
                <h1 class="name">DerSucker</h1>
                <div class="accent-line"></div>
            </div>
            
            <div class="content">
                <p class="bio">
                    Passionate developer. Exploring code, creativity, and the intersection of technology and design.
                </p>
                
                <div class="contact-section">
                    <h2>Get in Touch</h2>
                    <div class="contact-item">
                        <span class="label">Email</span>
                        <a href="mailto:contact@example.com" class="email">contact@example.com</a>
                    </div>
                </div>
                
                <div class="links-section">
                    <a href="#" class="social-link">GitHub</a>
                    <a href="#" class="social-link">Portfolio</a>
                    <a href="#" class="social-link">LinkedIn</a>
                </div>
            </div>
            
            <div class="footer">
                <p class="footer-text">© 2026 DerSucker. All rights reserved.</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
